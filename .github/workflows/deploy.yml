name: Deploy

on:
  push:
    branches: [main]

permissions:
  id-token: write   # required to mint the OIDC token for AWS
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Build site (Vite + React, statically generated)
        working-directory: web
        run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::071329584603:role/github-deploy-portfolio
          aws-region: ap-south-1

      - name: Sync site to S3
        run: |
          aws s3 sync web/dist s3://rishavraj.info \
            --delete \
            --exclude ".DS_Store"

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id E1A5LYTGBYBYRY \
            --paths "/*"
