services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: rbac
      POSTGRES_PASSWORD: rbac
      POSTGRES_DB: rbac_demo
    ports:
      - "5432:5432"
    volumes:
      - rbac_demo_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rbac"]
      interval: 2s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgres://rbac:rbac@postgres:5432/rbac_demo
      REDIS_URL: redis://redis:6379
      PORT: 4000
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: sh -c "npx tsx scripts/migrate.ts && npx tsx scripts/seed.ts || true && node dist/src/server.js"

  ui:
    build:
      context: ./ui
      args:
        VITE_API_URL: http://localhost:4000
    ports:
      - "5174:80"
    depends_on:
      - backend

volumes:
  rbac_demo_pg:
